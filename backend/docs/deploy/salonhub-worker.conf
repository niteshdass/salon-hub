; Queue worker. NOT OPTIONAL: 4 of the app's 6 Mailables implement
; ShouldQueue (BookingCancelledMail, BookingConfirmationMail,
; BookingRescheduledMail, NewBookingMail), and App\Jobs\SendAppointmentReminder
; (dispatched by the reminders:send scheduled command) also implements
; ShouldQueue. With no worker running, zero booking confirmations,
; cancellations, reschedules or appointment reminders are ever delivered.
; (CustomerLoginCodeMail and ContactMessageMail are sent inline, not
; queued, so they don't depend on this worker.)
;
; Before installing, create the log directory this program writes to:
;   sudo mkdir -p /var/log/salonhub && sudo chown www-data:www-data /var/log/salonhub
;
; Install to /etc/supervisor/conf.d/salonhub-worker.conf then:
;   supervisorctl reread && supervisorctl update && supervisorctl start salonhub-worker:*
[program:salonhub-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/salonhub/backend/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/salonhub/worker.log
stopwaitsecs=3600
