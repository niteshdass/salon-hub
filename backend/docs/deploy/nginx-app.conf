# app.salonhub.com — dashboard SPA + API, one origin so the SPA needs no CORS.
server {
    listen 443 ssl http2;
    server_name app.salonhub.com salonhub.com www.salonhub.com;

    root /var/www/salonhub/backend/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/salonhub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salonhub.com/privkey.pem;

    # Stated here rather than inherited from Ubuntu's nginx default, which
    # still offers TLS 1.0/1.1. Set explicitly instead of including
    # /etc/letsencrypt/options-ssl-nginx.conf: that file is shipped by the
    # certbot *nginx* plugin, and this deployment issues certificates with
    # --dns-cloudflare, so it may not exist. (Do not do both — a second
    # ssl_protocols in one server block is a duplicate-directive error.)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SalonHubTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 12M;   # gallery and cover uploads

    # Cloudflare proxies every record in the runbook's DNS table, so without
    # this $remote_addr is a Cloudflare edge IP and every per-IP throttle in
    # routes/api.php becomes a platform-wide limit. See the snippet's header.
    include snippets/salonhub-cloudflare-realip.conf;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Every hostname this deployment answers on is HTTPS-only (both vhosts
    # 301 from :80), and the wildcard cert covers the subdomains, so
    # includeSubDomains is safe. No `preload` — that submission is effectively
    # irreversible and is an owner decision, not a config default.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hashed Vite assets never change under a given name. deploy.sh copies
    # frontend/dist to backend/public/app, so the built assets land at
    # public/app/assets/* — see resources/views/app.blade.php.
    location /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # nginx REPLACES the inherited add_header set rather than merging, so
        # the four server-level headers above are silently dropped in any
        # location that declares one of its own. Repeated here so what this
        # location serves matches what the block above says it serves.
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Uploaded images, served from the storage symlink.
    location /storage/ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Nothing under the upload symlink is ever executable. A regex location
    # beats the `location /storage/` prefix above, so without this a .php file
    # that reached storage/app/public would be handed to php-fpm. Getting one
    # there needs an upload-validation regression (StoreGalleryRequest and
    # UploadOrganizationImageRequest validate `image`, and hashName() derives
    # the extension from the guessed MIME type, not the client filename) — but
    # this is the one place where such a slip becomes remote code execution.
    # Must precede the generic \.php$ location: regex locations are tried in
    # declaration order and the first match wins.
    location ~ ^/storage/.*\.php$ { deny all; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

server {
    listen 80;
    server_name app.salonhub.com salonhub.com www.salonhub.com;
    return 301 https://$host$request_uri;
}
