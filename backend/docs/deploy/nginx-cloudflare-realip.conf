# Cloudflare -> real client IP. Included by BOTH nginx-app.conf and
# nginx-salon.conf; install it to /etc/nginx/snippets/ (see the runbook's
# "Install the nginx vhosts" step).
#
# WHY THIS FILE EXISTS
#
# The runbook's DNS table creates `A app`, `A @` and `A *` all **Proxied**
# through Cloudflare, so every request reaches nginx from a Cloudflare edge
# address. Without the directives below, $remote_addr — and therefore
# Laravel's Request::ip() — is that edge address, shared by every visitor on
# the platform. Every per-IP rate limit in routes/api.php then becomes a
# GLOBAL limit: `throttle:3,1` on register means three signups per minute
# across all salons, `throttle:20,1` on login means twenty attempts per
# minute platform-wide, and AuthController::login's `login:<email>|<ip>` key
# degenerates to a per-email key that any visitor can trip on the real
# owner's behalf.
#
# `set_real_ip_from` lists the only sources whose CF-Connecting-IP header is
# believed. A request arriving from anywhere else keeps its own address, so
# a client cannot spoof its IP by inventing the header.
#
# WHAT THIS IS NOT
#
# This is nginx-level only, and deliberately so. Do NOT "fix" the same
# problem by calling trustProxies() in bootstrap/app.php: that would also
# make Laravel honour X-Forwarded-Host, which is what selects the tenant on
# the salon vhost, and the runbook's verification checklist tests that this
# stays closed. real_ip_header rewrites $remote_addr only — the Host header
# is untouched.
#
# MAINTENANCE
#
# Cloudflare publishes these ranges at https://www.cloudflare.com/ips/ and
# changes them rarely but does change them. Refresh with:
#   curl -s https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6
# A stale range is fail-safe in the direction that matters: an unlisted
# Cloudflare edge is simply not trusted, so its requests share one bucket
# again (the pre-fix behaviour) rather than letting anyone spoof an address.
#
# If you are NOT fronting the origin with Cloudflare, do not install this
# file — remove the two `include` lines from the vhosts instead. Trusting
# ranges that cannot actually reach you is harmless; trusting a proxy that
# is not in front of you is not.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
