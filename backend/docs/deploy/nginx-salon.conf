# *.salonhub.com — one nginx vhost fronts every salon's booking site so no
# per-salon config is ever generated.
#
# The Host header selects the tenant here, so what this vhost forwards is
# security-relevant. `$http_host` reaches PHP unmodified and Laravel reads
# it with Request::getHost(); ResolvePublicTenant then looks it up through
# Domain::resolveOrganizationForHost, which answers only for a VERIFIED
# domain row belonging to an ACTIVE organization, and 404s otherwise.
#
# Do NOT add `proxy_set_header X-Forwarded-Host` or configure trusted
# proxies for this vhost. The application deliberately trusts no proxy
# (bootstrap/app.php never calls trustProxies), so X-Forwarded-Host is
# ignored and a client cannot name a tenant with a header nginx did not
# set. Trusting it would hand tenant selection to whoever can send a header.
#
# Two ways into a salon's site, both live:
#   - https://<slug>.salonhub.com/          (this vhost; slug from the Host)
#   - https://app.salonhub.com/salon/<slug> (path-scoped; slug from the URL)
# The SPA picks between them with resolveSlugFromHost() in
# frontend/src/lib/tenantHost.js, and the API mirrors the split with the
# host-resolved /api/public-site/* group and the path-scoped
# /api/public/{org}/* group in routes/api.php — separate prefixes, so neither
# can ever shadow the other. CORS trusts the subdomain pattern via APP_DOMAIN
# (see backend/config/cors.php's allowed_origins_patterns), which reads the
# same env var and default as config('app.domain').
#
# Requires a wildcard DNS A record (*.salonhub.com -> this VPS) and a
# certificate that covers BOTH the apex and the wildcard — nginx-app.conf's
# apex/www/app names and every <slug>.salonhub.com share the one cert below
# — which needs the DNS-01 challenge (see the runbook's Certificates section
# for the Cloudflare credentials file this command reads):
#   certbot certonly --dns-cloudflare \
#     --dns-cloudflare-credentials /root/.secrets/certbot/cloudflare.ini \
#     --deploy-hook "systemctl reload nginx" \
#     -d salonhub.com -d '*.salonhub.com'
server {
    listen 443 ssl http2;
    server_name ~^(?<slug>[a-z0-9-]+)\.salonhub\.com$;

    root /var/www/salonhub/backend/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/salonhub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salonhub.com/privkey.pem;

    # Same reasoning as nginx-app.conf: Ubuntu's nginx default still offers
    # TLS 1.0/1.1, and options-ssl-nginx.conf ships with the certbot nginx
    # plugin, which this DNS-01 deployment does not use.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SalonHubTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # These are the customer-facing pages — where names, phone numbers and
    # email addresses are typed — so they get at least what the staff
    # dashboard gets. X-Frame-Options SAMEORIGIN means a salon cannot embed
    # its booking page in an iframe on its own separate website; that is not a
    # feature the product offers today, and the deliberate choice is to keep
    # the page unframable rather than clickjackable. Relax it to a
    # Content-Security-Policy frame-ancestors list if embedding is ever built.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cloudflare proxies the wildcard record, so without this $remote_addr is
    # a Cloudflare edge IP and the per-IP throttles on the public booking and
    # customer-code routes become platform-wide. See the snippet's header —
    # it rewrites $remote_addr only, never the Host header this vhost uses to
    # select the tenant.
    include snippets/salonhub-cloudflare-realip.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Same document root as nginx-app.conf, so the same rule applies: nothing
    # reachable through the storage:link symlink is ever executed. Must
    # precede the generic \.php$ location.
    location ~ ^/storage/.*\.php$ { deny all; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

server {
    listen 80;
    server_name ~^[a-z0-9-]+\.salonhub\.com$;
    return 301 https://$host$request_uri;
}
