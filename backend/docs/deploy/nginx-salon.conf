# *.salonhub.com — one nginx vhost fronts every salon's booking site so no
# per-salon config is ever generated. Today the booking SPA resolves the
# slug from the URL path (/salon/:slug, /book/:slug — see
# frontend/src/router/index.js) and the public API resolves it from the
# {org} route param (routes/api.php); ResolvePublicTenant also supports a
# Host-header -> Domain lookup for a later custom-domain / subdomain flow.
# This vhost, the wildcard DNS record and the wildcard cert are provisioned
# now so that plumbing is ready before Task 12 wires subdomain resolution
# all the way through. CORS already trusts the pattern via APP_DOMAIN (see
# backend/config/cors.php's allowed_origins_patterns).
#
# Requires a wildcard DNS A record (*.salonhub.com -> this VPS) and a
# certificate that covers BOTH the apex and the wildcard — nginx-app.conf's
# apex/www/app names and every <slug>.salonhub.com share the one cert below
# — which needs the DNS-01 challenge (see the runbook's Certificates section
# for the Cloudflare credentials file this command reads):
#   certbot certonly --dns-cloudflare \
#     --dns-cloudflare-credentials /root/.secrets/certbot/cloudflare.ini \
#     --deploy-hook "systemctl reload nginx" \
#     -d salonhub.com -d '*.salonhub.com'
server {
    listen 443 ssl http2;
    server_name ~^(?<slug>[a-z0-9-]+)\.salonhub\.com$;

    root /var/www/salonhub/backend/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/salonhub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salonhub.com/privkey.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

server {
    listen 80;
    server_name ~^[a-z0-9-]+\.salonhub\.com$;
    return 301 https://$host$request_uri;
}
